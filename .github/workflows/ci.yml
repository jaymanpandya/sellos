name: CI

on:
  push:
    branches:
      - 1.0
  pull_request:

concurrency:
  group: 1.0-sellos-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build (P0.07)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Record start time (P0.07)
        run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app sellos $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app sellos
          bench build
        env:
          CI: 'Yes'

      - name: Build web app (P0.07)
        # Built inside the bench copy of the app, because bench get-app clones only tracked files
        # and the built page is not tracked.
        working-directory: /home/runner/frappe-bench/apps/sellos/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app sellos
        env:
          TYPE: server

      - name: Report run time (P0.07)
        if: always()
        run: |
          elapsed=$(( $(date +%s) - CI_START ))
          echo "Server job run time: $((elapsed / 60)) min $((elapsed % 60)) s" | tee -a "$GITHUB_STEP_SUMMARY"
