name: CI

on:
  push:
    branches:
      - 1.0
  pull_request:

concurrency:
  group: 1.0-sellos-${{ github.event.number }}
  cancel-in-progress: true

# SOS-SETUP-28: actions: read lets each job read its own and the push's runner minutes.
permissions:
  contents: read
  actions: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build (P0.07)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Runner minutes (SOS-SETUP-28)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lib/ci_minutes.py job Frontend

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Record start time (P0.07)
        run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Bench cache key (SOS-SETUP-28)
        # The exact Python (the bench's environment links to it), the app's requirements and the ISO
        # week, so a cached Frappe clone is at most a week behind version-16.
        run: echo "BENCH_KEY=bench-server-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}-$(date +%G-%V)" >> "$GITHUB_ENV"

      - name: Restore the bench (SOS-SETUP-28)
        # The Frappe clone, the Python environment and node_modules, as they are after bench init and
        # the requirements. apps/sellos and the sites are never cached: each run gets this commit.
        id: bench-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/frappe-bench
            !/home/runner/frappe-bench/apps/sellos
            !/home/runner/frappe-bench/apps/sellos/**
          key: ${{ env.BENCH_KEY }}

      - name: Setup
        run: |
          pip install frappe-bench
          if [ "${{ steps.bench-cache.outputs.cache-hit }}" != "true" ]; then
            # Pinned to the branch the local bench runs. scripts/check_ci_parity.py keeps them equal.
            bench init --frappe-branch version-16 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          fi

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          # The app is never taken from the cache: run 42944801058 restored a copy, and get-app stopped
          # at its overwrite prompt. Each run gets this commit (SOS-SETUP-28).
          rm -rf apps/sellos
          bench get-app sellos $GITHUB_WORKSPACE
          bench setup requirements --dev
        env:
          CI: 'Yes'

      - name: Save the bench (SOS-SETUP-28)
        # Saved before any site exists, so only the bench itself is cached.
        if: steps.bench-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/frappe-bench
            !/home/runner/frappe-bench/apps/sellos
            !/home/runner/frappe-bench/apps/sellos/**
          key: ${{ env.BENCH_KEY }}

      - name: Create the site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app sellos
          bench build
        env:
          CI: 'Yes'

      - name: Build web app (P0.07)
        # Built inside the bench copy of the app, because bench get-app clones only tracked files
        # and the built page is not tracked.
        working-directory: /home/runner/frappe-bench/apps/sellos/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Create the tenant provisioner account (SOS-SETUP-18)
        # The narrow account tenant tests create and drop sites with, as on the local bench: CREATE
        # USER, RELOAD and SHOW DATABASES globally, and everything on sellos\_tenant\_% and
        # sellos_tenant_% only, the same two grants the local provisioner has. Frappe's new-site runs
        # GRANT ALL ON sellos_tenant_<id>.*, and MariaDB refuses it when the grant option comes only
        # from the escaped pattern: new-site then fails with 1044 (run 42843324685,
        # SOS-SETUP-24). The password is made fresh for this job, masked in the log, and passed to
        # later steps through GITHUB_ENV. It is never written in the repository, where the tenant
        # leak test (check_no_secret_leak.py over the app folder) would rightly find it. The SQL goes
        # in on stdin, so the password is not on a command line.
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "SELLOS_DB_PROVISIONER_PASSWORD=$pw" >> "$GITHUB_ENV"
          mariadb -h 127.0.0.1 -u root -proot <<SQL
            CREATE USER 'sellos_provisioner'@'%' IDENTIFIED BY '$pw';
            GRANT CREATE USER, RELOAD, SHOW DATABASES ON *.* TO 'sellos_provisioner'@'%';
            GRANT ALL PRIVILEGES ON \`sellos\\_tenant\\_%\`.* TO 'sellos_provisioner'@'%' WITH GRANT OPTION;
            GRANT ALL PRIVILEGES ON \`sellos_tenant_%\`.* TO 'sellos_provisioner'@'%' WITH GRANT OPTION;
          SQL

      - name: Make the tenant template (SOS-SETUP-28)
        # One tenant site made with Frappe's full install, dumped with the provisioner account and
        # dropped. Every tenant site the tests make is then built from the dump (bench new-site
        # --source-sql), except in the one real provisioning test, which uses the full install
        # (sellos.tests.tenant_template.full_install, sellos/provisioning/test_tenant_template.py).
        working-directory: /home/runner/frappe-bench/sites
        run: |
          ../env/bin/python -m sellos.tests.tenant_template make "$RUNNER_TEMP/tenant-template.sql"
          echo "SELLOS_TENANT_TEMPLATE_SQL=$RUNNER_TEMP/tenant-template.sql" >> "$GITHUB_ENV"
        env:
          SELLOS_DB_PROVISIONER_USER: sellos_provisioner

      - name: Run Tests
        # The wrapper prints every batch's summary and the exit code, and says which batch failed.
        # Frappe runs integration tests and the rest as two batches, and the last "OK" can follow a
        # FAILED one (run 42830839891). The exit code decides, not a summary line (SOS-SETUP-24).
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bash "$GITHUB_WORKSPACE/scripts/lib/report_test_exit.sh" bench --site test_site run-tests --app sellos
        env:
          TYPE: server
          SELLOS_DB_PROVISIONER_USER: sellos_provisioner
          # SELLOS_DB_PROVISIONER_PASSWORD comes from GITHUB_ENV, set when the account is made.

      - name: Report run time (P0.07)
        if: always()
        run: |
          elapsed=$(( $(date +%s) - CI_START ))
          echo "Server job run time: $((elapsed / 60)) min $((elapsed % 60)) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Runner minutes (SOS-SETUP-28)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/scripts/lib/ci_minutes.py" job Server

  ui:
    # Modelled on frappe/frappe .github/workflows/ui-tests.yml and its setup action: a fresh site, the
    # app installed, bench start running in the background, then bench run-ui-tests. Cypress picks the
    # site by its host name, so test_site is added to /etc/hosts and given host_name http://test_site:8000.
    runs-on: ubuntu-latest
    name: UI
    timeout-minutes: 45
    env:
      PYTHONWARNINGS: ignore
      DB_ROOT_PASSWORD: db_root
      # Tells the Cypress specs which site cy.bench runs its fixtures on.
      CYPRESS_site: test_site

    services:
      mariadb:
        image: mariadb:11.8
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3 --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
        env:
          MARIADB_ROOT_PASSWORD: db_root

    steps:
      - name: Add test_site to /etc/hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bench cache key (SOS-SETUP-28)
        run: echo "BENCH_KEY=bench-ui-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}-$(date +%G-%V)" >> "$GITHUB_ENV"

      - name: Restore the bench (SOS-SETUP-28)
        # As in the Server job, but its own key: this bench has Redis configs and its Procfile edits.
        id: bench-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/frappe-bench
            !/home/runner/frappe-bench/apps/sellos
            !/home/runner/frappe-bench/apps/sellos/**
          key: ${{ env.BENCH_KEY }}

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt-get install -y redis-server mariadb-client

      - name: Init bench
        run: |
          pip install frappe-bench
          if [ "${{ steps.bench-cache.outputs.cache-hit }}" != "true" ]; then
            # Pinned to the branch the local bench runs. scripts/check_ci_parity.py keeps them equal.
            bench init ~/frappe-bench --frappe-branch version-16 --skip-assets --python "$(which python)"
          fi
          cd ~/frappe-bench
          # No file watcher or scheduler in CI, as in Frappe's own setup.
          sed -i '/^watch:/d' Procfile
          sed -i '/^schedule:/d' Procfile

      - name: Get the app and install requirements
        working-directory: /home/runner/frappe-bench
        run: |
          # The app is never taken from the cache: run 42944801058 restored a copy, and get-app stopped
          # at its overwrite prompt. Each run gets this commit (SOS-SETUP-28).
          rm -rf apps/sellos
          bench get-app sellos $GITHUB_WORKSPACE
          bench setup requirements --dev
        env:
          CI: 'Yes'

      - name: Save the bench (SOS-SETUP-28)
        if: steps.bench-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/frappe-bench
            !/home/runner/frappe-bench/apps/sellos
            !/home/runner/frappe-bench/apps/sellos/**
          key: ${{ env.BENCH_KEY }}

      - name: Create the site
        working-directory: /home/runner/frappe-bench
        run: |
          mariadb -h 127.0.0.1 -u root -p"$DB_ROOT_PASSWORD" -e "SET GLOBAL innodb_flush_log_at_trx_commit = 0; SET GLOBAL sync_binlog = 0;"
          bench set-config -g root_login root
          bench set-config -g root_password "$DB_ROOT_PASSWORD"
          bench set-config -g admin_password admin
          bench new-site test_site --db-type mariadb --db-host 127.0.0.1 --db-name test_sellos --db-password test_sellos --verbose
          bench --site test_site set-config allow_tests 1 --parse
          bench --site test_site set-config host_name "http://test_site:8000"
          bench --site test_site install-app sellos

      - name: Build the web app and assets
        # The web app is built inside the bench copy of the app, because bench get-app clones only
        # tracked files and the built page is not tracked.
        working-directory: /home/runner/frappe-bench
        run: |
          (cd apps/sellos/frontend && npm ci --no-audit --no-fund && npm run build)
          CI=Yes bench build --force

      - name: Start bench
        # Before any site command that needs the services, as in Frappe's setup action, whose last
        # step is bench start. This job has no Redis service container: redis-server comes from
        # apt and bench init writes its configs, so redis_cache and redis_queue run only once
        # bench start's Procfile starts them. bench migrate refuses to run without them.
        working-directory: /home/runner/frappe-bench
        run: |
          bench start &> "$GITHUB_WORKSPACE/bench_start.log" &
          for _ in $(seq 1 90); do
            curl -s -o /dev/null http://test_site:8000/api/method/ping && break
            sleep 2
          done
          curl -sf -o /dev/null http://test_site:8000/api/method/ping || { tail -n 60 "$GITHUB_WORKSPACE/bench_start.log"; exit 1; }

      - name: Prepare the clean site
        # The same fixture scripts/run-tests.sh runs on every local gate run (SOS-P1-06A made it work).
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site migrate
          bench --site test_site execute sellos.tests.ui_fixtures.prepare_clean_site
          bench --site test_site clear-cache

      - name: Restore the flaky log (SOS-SETUP-27)
        # The count of reruns that passed lives across runs in the Actions cache, as the local gate's
        # lives in ~/iespl-baseline/sellos-flaky.log. Each run saves a new entry and the next run
        # restores the latest. To clear it after a flaky spec is fixed, delete every cache whose key
        # starts with sellos-flaky- (gh cache list --key sellos-flaky-, then gh cache delete).
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/sellos-ci/sellos-flaky.log
          key: sellos-flaky-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sellos-flaky-

      - name: Run the Cypress suite
        # The same rerun policy as the local gate, from the same script (scripts/lib/ui_flaky.sh): a
        # failed spec is rerun once, alone; a rerun that passes is FLAKY and the job passes; a spec
        # FLAKY three times fails the job. The flaky specs go in the job summary. CI run 42925739766
        # failed on one flake the gate had rerun and passed (DEV_STRATEGY.md section 4, row 31).
        id: cypress
        working-directory: /home/runner/frappe-bench
        env:
          SITE: test_site
          APP: sellos
          SELLOS_MAX_RERUN: 5
          SELLOS_FLAKY_LIMIT: 3
          SELLOS_FLAKY_LOG: /home/runner/sellos-ci/sellos-flaky.log
        run: bash "$GITHUB_WORKSPACE/scripts/lib/ui_flaky.sh" "$RUNNER_TEMP/cypress.log"

      - name: Save the flaky log (SOS-SETUP-27)
        # Saved whether the suite passed or failed, so a third strike is remembered too. The script
        # creates the file before Cypress starts, so it exists whenever the suite step ran.
        if: always() && steps.cypress.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/sellos-ci/sellos-flaky.log
          key: sellos-flaky-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: /home/runner/frappe-bench/apps/sellos/cypress/screenshots
          if-no-files-found: ignore

      - name: Show bench output
        if: always()
        run: |
          cat "$GITHUB_WORKSPACE/bench_start.log" || true

      - name: Runner minutes (SOS-SETUP-28)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/scripts/lib/ci_minutes.py" job UI

  minutes:
    # SOS-SETUP-28: CI minutes are a budget (DEV_STRATEGY.md section 4, row 32). After the other jobs,
    # whatever their result, the run summary gets "runner minutes for this push: N" over every
    # workflow run on this commit, this job included. It never fails the run.
    name: Runner minutes
    runs-on: ubuntu-latest
    needs: [frontend, tests, ui]
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/lib
      - name: Runner minutes for this push
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lib/ci_minutes.py push
