<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>Enquiry · {{ company }}</title>
		<style>
			/* The shared look of docs/UI_STANDARD.md: neutral page, white card with the soft shadow, SellOS green as the accent only. */
			@font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap; src: url("/assets/sellos/fonts/Inter-Regular.woff2") format("woff2"); }
			@font-face { font-family: "Inter"; font-style: normal; font-weight: 500; font-display: swap; src: url("/assets/sellos/fonts/Inter-Medium.woff2") format("woff2"); }
			@font-face { font-family: "Inter"; font-style: normal; font-weight: 600; font-display: swap; src: url("/assets/sellos/fonts/Inter-SemiBold.woff2") format("woff2"); }
			body { margin: 0; background: #f4f5f7; color: #1d222b; font-family: Inter, system-ui, "Segoe UI", sans-serif; font-size: 1rem; line-height: 1.6; }
			main { max-width: 32rem; margin: 0 auto; padding: 2rem 0.875rem 3rem; }
			h1 { font-size: 1.5rem; line-height: 1.25; font-weight: 600; margin: 0 0 0.25rem; }
			p { color: #3f4a5c; }
			.card { background: #fff; border: 1px solid #dde2ec; border-radius: 14px; box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 6px 20px -8px rgba(17, 24, 39, 0.1); padding: 1.25rem; margin-top: 1rem; }
			label { display: block; font-weight: 500; color: #3f4a5c; margin-top: 0.875rem; }
			input[type="text"], input[type="tel"], input[type="email"], textarea { box-sizing: border-box; width: 100%; min-height: 44px; padding: 0.5rem 0.75rem; border: 1px solid #778399; border-radius: 14px; font: inherit; color: #1d222b; background: #fff; }
			input[type="text"]:focus, input[type="tel"]:focus, input[type="email"]:focus, textarea:focus { outline: none; border-color: #0f4c35; box-shadow: 0 0 0 3px rgba(15, 76, 53, 0.18); }
			.check { display: flex; gap: 0.5rem; align-items: center; font-weight: 400; }
			.check input { accent-color: #0f4c35; width: 1.125rem; height: 1.125rem; }
			.wording { font-size: 0.875rem; color: #525f78; margin: 1rem 0 0; }
			button { margin-top: 1rem; min-height: 44px; padding: 0 1.125rem; border: 0; border-radius: 14px; background: #0f4c35; color: #fff; font: inherit; font-weight: 500; cursor: pointer; transition: background-color 120ms; }
			button:hover { background: #0a3626; }
			button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(15, 76, 53, 0.18); }
			.notice { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 14px; }
			.ok { background: #ecfaf5; color: #08724e; border: 1px solid #9fe5cd; }
			.bad { background: #fef0ec; color: #be3910; border: 1px solid #f8b5a1; }
			.hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
			img.logo { max-height: 3rem; margin-bottom: 0.5rem; }
		</style>
	</head>
	<body>
		<main data-testid="sellos-enquiry-page">
			{% if logo %}<img class="logo" src="{{ logo | e }}" alt="" />{% endif %}
			<h1>Enquire with {{ company | e }}</h1>
			<p>Tell us how to reach you and we will call you back.</p>
			{% if not key %}
			<div class="notice bad" data-testid="sellos-enquiry-incomplete">
				This link is not complete. Please open the link you were sent again.
			</div>
			{% else %}
			<form id="enquiry-form" class="card" data-testid="sellos-enquiry-form" novalidate>
				<label for="name">Your name</label>
				<input id="name" name="name" type="text" maxlength="100" required autocomplete="name" data-testid="sellos-enquiry-name" />
				<label for="phone">Phone number</label>
				<input id="phone" name="phone" type="tel" maxlength="20" required autocomplete="tel" data-testid="sellos-enquiry-phone" />
				<label for="email">Email (optional)</label>
				<input id="email" name="email" type="email" maxlength="140" autocomplete="email" data-testid="sellos-enquiry-email" />
				<label for="message">Message (optional)</label>
				<textarea id="message" name="message" rows="3" maxlength="1000" data-testid="sellos-enquiry-message"></textarea>
				<label class="check" for="stop">
					<input id="stop" name="stop" type="checkbox" value="1" data-testid="sellos-enquiry-stop" />
					Stop contacting me
				</label>
				<div class="hp" aria-hidden="true">
					<label for="website">Leave this empty</label>
					<input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
				</div>
				<p class="wording" data-testid="sellos-enquiry-wording">{{ consent_wording | e }}</p>
				<button type="submit" data-testid="sellos-enquiry-submit">Send</button>
				<div id="enquiry-result" role="status" data-testid="sellos-enquiry-result"></div>
			</form>
			{% endif %}
		</main>
		<script>
			(function () {
				var form = document.getElementById("enquiry-form");
				if (!form) return;
				var result = document.getElementById("enquiry-result");
				var key = {{ key | tojson }};
				var url = "/api/method/{{ method }}";
				form.addEventListener("submit", function (event) {
					event.preventDefault();
					var body = { key: key };
					["name", "phone", "email", "message", "website"].forEach(function (field) {
						body[field] = form.elements[field].value;
					});
					body.stop = form.elements.stop.checked ? "1" : "0";
					fetch(url, {
						method: "POST",
						headers: { "Content-Type": "application/json", Accept: "application/json" },
						body: JSON.stringify(body),
						credentials: "omit",
					})
						.then(function (response) {
							return response.json().then(function (data) {
								return { ok: response.ok, data: data };
							});
						})
						.then(function (answer) {
							var message = answer.data && answer.data.message;
							if (answer.ok && message && message.thank_you) {
								form.reset();
								result.className = "notice ok";
								result.dataset.state = "thanks";
								result.textContent = message.thank_you + " Your reference is " + message.reference + ".";
							} else {
								result.className = "notice bad";
								result.dataset.state = "refused";
								result.textContent = typeof message === "string" ? message : "We could not take this form. Please check it and try again.";
							}
						})
						.catch(function () {
							result.className = "notice bad";
							result.dataset.state = "refused";
							result.textContent = "We could not take this form. Please try again in a moment.";
						});
				});
			})();
		</script>
	</body>
</html>
